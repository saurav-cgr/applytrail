catalogs:
- name: default
  url: https://raw.githubusercontent.com/github/spec-kit/main/extensions/catalog.json
  priority: 1
  install_allowed: true
- name: community
  url: https://raw.githubusercontent.com/github/spec-kit/main/extensions/catalog.community.json
  priority: 2
  install_allowed: true
hooks:
  after_tasks:
  - extension: loop
    command: speckit.loop.define
    enabled: true
    optional: true
    priority: 10
    prompt: Define an autonomous loop to drive these tasks to completion (maker/checker
      split, externalized state)?
    description: Set up a loop contract after task generation
    condition: null
  after_implement:
  - extension: loop
    command: speckit.loop.check
    enabled: true
    optional: true
    priority: 10
    prompt: Run an independent checker pass on this implementation (the model that
      wrote the code should not be the one to grade it)?
    description: Adversarial maker/checker verification after implementation
    condition: null
installed:
- loop
settings:
  auto_execute_hooks: true
